<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>市场信号监测</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;📈&lt;/text&gt;&lt;/svg&gt;">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <h1>市场信号监测</h1>
    <span class="sub">宏观 &amp; 市场 · 循证指标面板</span>
  </div>
  <div id="signal-strip" aria-label="信号总览"></div>
</header>

<div id="layout">
  <nav id="sidebar">
    <div class="nav-item nav-overview active" data-view="overview">
      <span class="nav-dot" style="background:var(--muted)"></span>总览
    </div>
    <div id="nav-groups"></div>
    <div class="nav-foot">
      <div id="meta-line">数据加载中…</div>
      <div class="disclaimer">仅供研究参考，不构成投资建议。<br>数据可能延迟或含误差。</div>
    </div>
  </nav>

  <main id="main">
    <section id="overview">
      <div id="cards"></div>
    </section>

    <section id="detail" hidden>
      <button id="back-btn">← 返回总览</button>
      <div class="detail-head">
        <div>
          <h2 id="d-title"></h2>
          <div id="d-updated" class="d-updated"></div>
          <div id="d-subtitle" class="d-subtitle"></div>
        </div>
        <div id="d-badge"></div>
      </div>
      <div id="d-readings" class="readings"></div>
      <div class="chart-toolbar">
        <div id="d-ranges" class="ranges" role="group" aria-label="时间窗口"></div>
        <span class="drag-hint">提示：图内拖拽平移 · Ctrl+滚轮（触控板双指捏合）缩放 · 下方滑块可任意拖动时间窗口</span>
      </div>
      <div id="d-chart" class="chart"></div>
      <div id="d-aux"></div>
      <div id="d-desc" class="desc"></div>
      <div id="d-source" class="src-line"></div>
    </section>
  </main>
</div>

<button id="theme-toggle" type="button" aria-label="切换深色/浅色模式">☀️ 浅色</button>
<button id="lang-toggle" type="button" aria-label="切换语言 / Switch language">EN · English</button>

<script src="vendor/echarts.min.js"></script>
<script src="app.js"></script>
</body>
</html>
