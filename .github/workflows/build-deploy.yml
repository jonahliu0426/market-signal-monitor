name: build-and-deploy

on:
  schedule:
    # 每日两次，按数据源实际发布节奏错开：
    # 1) UTC 23:30（美东晚间/北京早7:30）：美股收盘后取当日全部行情类 EOD（Cboe/Nasdaq）
    # 2) UTC 15:30（美东上午/北京晚23:30）：取美东上午发布的宏观与情绪数据
    #    （周四初请+AAII、周三NFCI、FRED 日频隔日值、月初 IBKR 等）
    - cron: "30 23 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # 把累积后的 data/cache 与新 bundle 提交回仓库
  pages: write
  id-token: write

concurrency:
  # 2026-08-07 从 "pages" 更名：原并发组被平台侧的幽灵锁卡死（所有运行永久 pending），
  # 换组名即换新队列绕开
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 PDF 解析工具（IBKR 月度指标为 PDF 新闻稿）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: 构建数据包
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 build_data.py

      - name: 提交累积数据回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache public/data
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%FT%H:%MZ)"
          git pull --rebase origin main || true
          git push

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
